name: Build Windows Desktop App (sandragestion.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build sandragestion.exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore windows/SandraGestion.sln

      - name: Run Automated Tests
        run: dotnet test windows/SandraGestion.Tests/SandraGestion.Tests.csproj -c Release

      - name: Publish Single-File Executable (sandragestion.exe)
        run: |
          dotnet publish windows/SandraGestion.Wpf/SandraGestion.Wpf.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./dist/windows

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandragestion-windows-x64
          path: ./dist/windows/sandragestion.exe
